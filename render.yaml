# ── Render Blueprint — Attack Path Analyzer (backend only) ────────────────────
# The frontend is deployed separately on Vercel, so this blueprint provisions
# only the FastAPI backend. CORS is wide-open ("*") since the app has no auth,
# so the Vercel frontend can call it with no extra wiring.
#
# Setup:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → pick this repo (uses render.yaml).
#   3. When prompted, paste your GROQ_API_KEY (required for AI narration).
#      Optionally set NVD_API_KEY / SLACK_WEBHOOK_URL.
#   4. Deploy. Render provisions auto-TLS (https) and a public URL.
#
# Notes:
#   - The container binds to Render's injected $PORT automatically.
#   - Free plan cold-starts after ~15 min idle (first request ~30-60s); the
#     frontend's offline mock-mode banner covers a cold/unreachable backend.
#   - History (SQLite) is ephemeral on the free plan — it rebuilds on each boot.

services:

  # ── Backend — FastAPI (Docker) ──────────────────────────────────────────────
  - type: web
    name: apa-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MOCK_MODE
        value: "true"                     # analyze the bundled nokia_telecom.json scenario
      - key: DEBUG
        value: "false"
      - key: CLUSTER_NAME
        value: nokia-telecom-cluster
      # Public, no-auth demo: allow all origins (incl. the Vercel frontend). The
      # backend has no cookies/auth, so the CORS layer drops credentials when "*".
      - key: CORS_ORIGINS
        value: '["*"]'
      # Required for AI kill-chain narration — paste in the dashboard at deploy.
      - key: GROQ_API_KEY
        sync: false
      # Optional integrations — leave blank if unused.
      - key: NVD_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

# ── Render Blueprint — Attack Path Analyzer ───────────────────────────────────
# Deploys two services from this repo:
#   1. apa-backend   — FastAPI (Docker), public API + Swagger at /docs
#   2. apa-frontend  — React/Vite static site, talks to the backend's public URL
#
# Setup:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → pick this repo (uses render.yaml).
#   3. When prompted, paste your GROQ_API_KEY (required for AI narration).
#      Optionally set NVD_API_KEY / SLACK_WEBHOOK_URL.
#   4. Deploy. Render provisions auto-TLS (https) for both services.
#
# Notes:
#   - The free plan cold-starts after ~15 min idle (first request ~30-60s). The
#     frontend's offline mock-mode banner covers a cold/unreachable backend.
#   - History (SQLite) is ephemeral on the free plan — it rebuilds on each boot.

services:

  # ── Backend — FastAPI (Docker) ──────────────────────────────────────────────
  - type: web
    name: apa-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MOCK_MODE
        value: "true"                     # analyze the bundled nokia_telecom.json scenario
      - key: DEBUG
        value: "false"
      - key: CLUSTER_NAME
        value: nokia-telecom-cluster
      # Public, no-auth demo: allow all origins. The backend has no cookies/auth,
      # so the CORS layer drops credentials automatically when this is "*".
      - key: CORS_ORIGINS
        value: '["*"]'
      # Required for AI kill-chain narration — paste in the dashboard at deploy.
      - key: GROQ_API_KEY
        sync: false
      # Optional integrations — leave blank if unused.
      - key: NVD_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

  # ── Frontend — React/Vite static site ───────────────────────────────────────
  - type: web
    name: apa-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && VITE_API_BASE_URL="https://$BACKEND_HOST" npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      # Render exposes the backend's hostname (no scheme); the build command
      # prefixes https:// and bakes it into the Vite bundle as VITE_API_BASE_URL.
      - key: BACKEND_HOST
        fromService:
          type: web
          name: apa-backend
          property: host
    routes:
      # SPA fallback — every path serves index.html so client-side routing works.
      - type: rewrite
        source: /*
        destination: /index.html
